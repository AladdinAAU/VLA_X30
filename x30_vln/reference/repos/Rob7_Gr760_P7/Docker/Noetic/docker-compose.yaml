services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros_noetic
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_MASTER_URI=http://127.0.0.1:11311
      - ROS_IP=127.0.0.1
    volumes:
      - ../../ros1_ws:/catkin_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw