# X30 simulation robot description: every number with its source.
# Source keys: man = reference/text/manual.txt (X30 Pro Application Manual V2.0.4), api = reference/text/api.txt,
#   digest = docs/robot/x30-interfaces.md, bag = datasets/real/lab_2026-10-06 (analysed with scripts/sim/compare_lidar_to_bag.py),
#   brief = the sim task brief, prework = C:/Users/LAB USER 1/Desktop/x30/src/src, assumption = chosen here, not documented.
# Read by: x30_sim (xacro + nodes, via X30_CONFIGS or the launch argument robot_config).
# Same schema is meant for configs/robot_real.yaml (frames, topics and sensor extrinsics).

robot:
  name: x30
  base_frame: base_link            # INTERFACES section 1; static identity to the URDF links base/TORSO (prework)
  odom_frame: odom
  world_frame: world
  # standing joint angles of the legged controller (HipX, HipY, Knee) per leg; used to freeze the legs in the kinematic backend
  stand_joints: [0.0, -0.732, 1.361]     # upstream x30_description config/gazebo.yaml stand_pos
  visual_mesh_voxel_m: 0.015            # decimation grid of the visual meshes (0 = off). The upstream meshes have 1.3 M vertices and cost ~100 ms per sensor frame in software rendering
  spawn_clearance_m: 0.005               # kinematic backend: gap between the feet and the ground (the body is gravity-free there)

frames:
  merged_lidar: lidar_link          # INTERFACES / bag; identical to base_link (the bag points sit exactly at the documented mounts in body coordinates)
  imu: imu_link
  camera: camera_link
  camera_optical: camera_optical_frame
  thermal: thermal_link
  thermal_optical: thermal_optical_frame

topics:                              # INTERFACES section 2
  lidar: /lidar_points
  imu: /imu/data
  odom: /odom
  rgb: /camera/color/image_raw
  rgb_info: /camera/color/camera_info
  depth: /camera/depth/image_raw
  thermal: /thermal/image_raw
  thermal_temperature: /thermal/temperature
  thermal_info: /thermal/camera_info
  cmd_vel: /cmd_vel

limits:
  legged:                            # INTERFACES section 2 (controller limits of unitree_guide_controller, prework cmd_vel_bridge.py)
    vx: [-0.4, 0.4]
    vy: [-0.3, 0.3]
    wz: [-0.5, 0.5]
  kinematic:                         # INTERFACES section 2 default
    vx: [-0.6, 0.6]
    vy: [-0.3, 0.3]
    wz: [-0.8, 0.8]
    accel_linear: 1.0                # m/s^2, assumption (digest section 7: 0.5-1.0 placeholder; the real stack must still respect <= 0.5)
    accel_angular: 2.0               # rad/s^2, assumption (digest section 7: 1-2)
    latency_s: 0.06                  # command-to-motion delay, assumption (digest section 7: 40-100 ms placeholder)
  deadband_fraction: 0.02            # api p.11-14 via digest: axis dead zone 2 % of the gait maximum
  cmd_timeout_s: 0.5                 # zero velocity when /cmd_vel is silent (digest 5.1: <= 0.5 s; the robot's own axis timeout is 1 s, api p.11-12)

# ---------------------------------------------------------------------------------------------------------------- sensors
lidar:
  # 4 x Livox (Mid-360 class). model inferred (digest 1.2); 360 deg horizontal, +52/-7 deg vertical: man p.69.
  rate_hz: 10                        # api p.38 (/lidar_points 10 Hz)
  horizontal_samples: 416            # chosen so that 416 x 48 = 19968 rays, the per-lidar point count of the bag (bag: 79872 = 4 x 19968)
  horizontal_fov_deg: 360            # man p.69
  vertical_samples: 48               # see above
  vertical_min_deg: -7               # man p.69
  vertical_max_deg: 52               # man p.69
  range_min_m: 0.1                   # Livox Mid-360 datasheet class value; bag: smallest non-zero range 0.098 m
  range_max_m: 40.0                  # brief (Livox spec ~40 m at 10 % reflectivity)
  noise_stddev_m: 0.03               # brief
  # Mount positions in the body frame (man p.67 table, mm -> m). Boresight = the sensor z axis (the axis the +52/-7 deg band is measured
  # around); pitch is the elevation of that axis above the horizon, measured towards the outside (front: +x, rear: -x).
  # Pitch values from the man p.67 figure (25/46/5/56 deg; arrows read as front-up +25, front-down -46, rear-up -5, rear-down -56);
  # the sign/axis reading was checked against the bag: for each lidar the pitch range over which all bag points stay inside the
  # [-7, +52] deg band is front-up 24..28, front-down -46..-40, rear-up -6..0, rear-down -58..-52 (all consistent).
  # Frame ids follow INTERFACES section 1 (fl/fr/rl/rr). The real layout is up/down, not left/right:
  #   fl = front-up, fr = front-down, rl = rear-up, rr = rear-down   (see docs/requests/sim-to-interfaces.md)
  mounts:
    fl: {name: front_up,   position_mm: [443.67, 0.0, 54.15],   boresight_pitch_deg: 25.0,  side: front, ip: unknown}
    fr: {name: front_down, position_mm: [432.97, 0.0, -55.19],  boresight_pitch_deg: -46.0, side: front, ip: unknown}
    rl: {name: rear_up,    position_mm: [-465.76, 0.0, 34.84],  boresight_pitch_deg: -5.0,  side: rear,  ip: unknown}
    rr: {name: rear_down,  position_mm: [-410.74, 0.0, -56.01], boresight_pitch_deg: -56.0, side: rear,  ip: unknown}
  # IPs 192.168.2.202-205 (brief, digest 1.2) are not assigned to mounts in any document.
  merged_order: [rl, rr, fr, fl]     # bag: the cloud is the concatenation rear-up, rear-down, front-down, front-up (derived from the zero-range points at the mounts)
  lines_per_lidar: 4                 # bag: line = 4 * lidar_index + (0..3), cycling per point
  # Self body occlusion. Real clouds contain many zero points (53 % in the bag) where no valid return exists (body, legs, no echo);
  # they are kept as points at the sensor origin with intensity 0 so the scan size stays constant (bag behaviour).
  invalid_as_origin: true
  self_mask:                         # boxes in base_link [xmin, xmax, ymin, ymax, zmin, zmax] m; a ray whose path inside a box is longer than min_chord_m is invalid
    min_chord_m: 0.12
    boxes:                           # assumption (torso mesh ~0.98 m long, hips at x +-0.291, y +-0.08..0.20, standing feet ~0.55 m below; prework README, upstream URDF)
      torso:      [-0.49, 0.49, -0.17, 0.17, -0.10, 0.14]
      leg_fl:     [0.14, 0.45, 0.04, 0.30, -0.62, 0.02]
      leg_fr:     [0.14, 0.45, -0.30, -0.04, -0.62, 0.02]
      leg_rl:     [-0.45, -0.14, 0.04, 0.30, -0.62, 0.02]
      leg_rr:     [-0.45, -0.14, -0.30, -0.04, -0.62, 0.02]
  intensity:                         # Livox reflectivity 0..255; gz gpu_lidar returns no usable intensity, so it is synthesised (assumption)
    # lognormal around the median of the non-zero real points (bag: p50 = 4, p75 = 18, p95 = 82, max 217); gz laser_retro > 0 overrides.
    median: 4.0
    sigma: 2.0
    max: 255
    range_falloff_m: 25.0
  tag_distribution:                  # bag, 1 scan, fraction of points per tag byte; used only when emulate_tags is true
    valid:   {0: 0.787, 16: 0.195, 32: 0.012, 1: 0.0058, 2: 0.0062, 4: 0.0059, 8: 0.0006, 64: 0.0014}
    invalid: {0: 0.640, 192: 0.324, 128: 0.030, 16: 0.012, 32: 0.002, 64: 0.0012}
  emulate_tags: true
  scan_time_spread_s: 0.1            # per-point timestamps spread over the scan period (bag: 100 ms)

imu:
  rate_hz: 200                       # api p.32 / digest 1.2 (/imu/data 200 Hz)
  position_mm: [130.45, -1.0, 14.9]  # man p.67
  # noise: not documented (digest section 7). Placeholder values of a consumer MEMS class (assumption), applied to the ROS-facing sensor only.
  gyro_noise_std: 0.0005             # rad/s
  accel_noise_std: 0.01              # m/s^2

camera:                              # one wide-angle USB camera: nothing documented (digest 1.2, 6.1) -> every number is an assumption
  # Placeholder 1280x720 / hfov 100-120 deg (digest 7). Default here is 640x480 because software rendering cost grows with the
  # pixel count (docs/reports/sim.md); set 1280x720 for perception experiments that need it (kinematic backend tolerates it).
  width: 640
  height: 480
  hfov_deg: 100.0
  rate_hz: 10.0                      # INTERFACES 10-15 Hz
  clip_near_m: 0.05
  clip_far_m: 30.0
  position_m: [0.50, 0.0, 0.04]      # prework: front face of the head (face at x = 0.487); assumption
  depth: true                        # sim-only /camera/depth/image_raw (rgbd_camera); false uses a plain camera (cheaper)

thermal:                             # NOT stock on the X30 (digest 1.2, 6.3): optional payload, default on in sim to test the pipeline
  enabled: true
  width: 384                         # assumption: 384x288 radiometric module class (digest 6.3 mentions 256x192 vs 384x288)
  height: 288
  hfov_deg: 56.0                     # assumption
  rate_hz: 5.0                       # INTERFACES 5-10 Hz; 5 because every extra thermal frame costs real time (docs/reports/sim.md)
  clip_near_m: 0.1
  clip_far_m: 20.0
  position_m: [0.50, 0.08, 0.04]     # assumption: beside the RGB camera, 8 cm to the left, to exercise the extrinsics
  ambient_c: 22.0                    # temperature of untagged geometry and background
  min_c: 0.0                         # sensor measurement range
  max_c: 150.0
  display_min_c: 15.0                # mono8 display image: fixed window [display_min, display_max] when display_auto is false
  display_max_c: 45.0
  display_auto: true                 # percentile auto-gain with a minimum span (like a camera's automatic gain)
  display_min_span_c: 10.0

# ------------------------------------------------------------------------------------------------------------ state topics
odometry:
  # /odom is the ground-truth base pose mapped into a planar odom frame (origin = pose at start), with optional leg-odometry-like error.
  # digest 1.2 / api p.20-22: leg odometry is planar (z = 0, roll = pitch = 0), 200 Hz; drift not documented (gap 8) -> nominal values are assumptions.
  rate_hz: 50
  noise_scale: 0.0                   # launch arg odom_noise: 0 = ground truth, 1 = nominal error below, 2 = twice, ...
  nominal:                           # all (noise_scale = 1) values are assumptions; per-run draws use the sim seed
    scale_error_std: 0.02            # multiplicative translation error, drawn once per run (1 sigma)
    step_noise_fraction: 0.05        # random translation error per update as a fraction of the step length
    yaw_scale_error_std: 0.02        # multiplicative yaw-rate error, drawn once per run
    yaw_drift_deg_per_m: 0.5         # slow bias: yaw error accumulated per metre travelled
    yaw_noise_deg_per_m: 0.2         # random yaw error per metre travelled (1 sigma)
battery:
  start_percent: 95.0
  drain_percent_per_hour: 20.0       # assumption; battery capacity/runtime is not documented (digest 1.3)
  nominal_voltage_v: 72.0            # digest 1.3 (dx field note)
  full_voltage_v: 84.0

ground_truth:
  object_confidence: 1.0
