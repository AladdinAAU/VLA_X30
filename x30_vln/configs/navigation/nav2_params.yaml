# Nav2 (ROS 2 Humble, nav2 1.1.x) for the X30 quadruped. Loaded by x30_navigation/launch/nav2.launch.py,
# followed by limits_<default|legged>.yaml (speed limits) and optionally controller_rpp.yaml.
#
# Design choices (details and numbers in docs/reports/navigation.md):
#  * Output goes to /cmd_vel_nav only: controller -> /cmd_vel_nav_raw -> velocity_smoother -> /cmd_vel_nav.
#    cmd_vel_mux / safety_guard (x30_modes) produce /cmd_vel. No collision_monitor here: the safety guard is the single safety path.
#  * Footprint: rectangle 1.0 x 0.5 m (vendor lidar mounts at x = +-0.45 m, body ~0.9-1.0 m long; width is not documented, 0.5 assumed).
#    A circle covering it (r = 0.56) would be wider than a 1 m door; the rectangle (planning width 0.46, a hair under the assumed 0.5) gives inscribed radius 0.23 so 1 m doors stay passable.
#  * Global frame map, odometry /odometry/active, TF map -> odom -> base_link.
#  * Costmaps are fed by /costmap_cloud (3D obstacles, ground and ceiling removed) and /scan (azimuth minimum, clearing).
#  * No BackUp recovery (no big reversing into space the lidar has not seen); recovery = clear costmaps, wait, small spin.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/active
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml is set by nav2.launch.py (path inside the package share)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 15.0
    odom_topic: /odometry/active
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3     # slow robot: 0.3 m in 15 s counts as progress
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.40
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 44
      model_dt: 0.07   # must be >= the controller period (1/15 s)
      batch_size: 1000
      iteration_count: 1
      motion_model: Omni                # the X30 can strafe (vy); weights below keep it mostly forward + turning
      vx_std: 0.15
      vy_std: 0.06
      wz_std: 0.25
      vx_max: 0.6                       # limits_*.yaml overrides these four
      vx_min: -0.1                      # no hard reverse
      vy_max: 0.3
      wz_max: 0.8
      ax_max: 0.5
      ax_min: -0.8
      ay_max: 0.4
      az_max: 1.0
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.7
      transform_tolerance: 0.15
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true        # the 1.0 m long body must not rotate or pass where a corner touches an inflated cell
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.0}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5, threshold_to_consider: 1.4}
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.5}

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false              # frontier goals are free cells; never plan through unknown space
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0       # keeps paths toward the middle of corridors and doors
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, wait]      # BackUp / DriveOnHeading deliberately not loaded
    spin:
      plugin: nav2_behaviors/Spin
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.6, 0.3, 0.8]       # limits_*.yaml overrides
    min_velocity: [-0.1, -0.3, -0.8]
    max_accel: [0.5, 0.4, 1.0]          # gentle: the X30 is told, not guaranteed, to follow
    max_decel: [-0.8, -0.6, -1.5]
    odom_topic: /odometry/active
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.5, 0.23], [0.5, -0.23], [-0.5, -0.23], [-0.5, 0.23]]"
      footprint_padding: 0.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: costmap_cloud   # /scan removed: with a LaserScan source the costmap TF froze (see docs/reports/navigation.md)
        # Obstacles are already height-filtered relative to the ground by cloud_leveler; heights here are in the odom frame
        # (whose z origin depends on the odometry source), so the limits are wide on purpose.
        costmap_cloud:
          topic: /costmap_cloud
          data_type: PointCloud2
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.7           # no clearing inside the body blind zone: an obstacle that came closer than 0.4 m is invisible, not gone
        scan:
          topic: /scan
          data_type: LaserScan
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.7           # no clearing inside the body blind zone: an obstacle that came closer than 0.4 m is invisible, not gone
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.60           # >= circumscribed radius 0.56: a cell this far from an obstacle is safe at any heading
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      footprint: "[[0.5, 0.23], [0.5, -0.23], [-0.5, -0.23], [-0.5, 0.23]]"
      footprint_padding: 0.0
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: costmap_cloud   # /scan removed: with a LaserScan source the costmap TF froze (see docs/reports/navigation.md)
        costmap_cloud:
          topic: /costmap_cloud
          data_type: PointCloud2
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          marking: true
          clearing: false                # the static map owns free space; clearing is for the local costmap
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
        scan:
          topic: /scan
          data_type: LaserScan
          min_obstacle_height: -3.0
          max_obstacle_height: 3.0
          marking: false
          clearing: false
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.60
      always_send_full_costmap: true
