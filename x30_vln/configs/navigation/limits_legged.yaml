# Speed limits of the sim `legged` locomotion (unitree_guide_controller FSM: vx +-0.4, vy +-0.3, wz +-0.5), INTERFACES.md section 2.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.4
      vx_min: -0.1
      vy_max: 0.3
      wz_max: 0.5
velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.3, 0.5]
    min_velocity: [-0.1, -0.3, -0.5]
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.5
