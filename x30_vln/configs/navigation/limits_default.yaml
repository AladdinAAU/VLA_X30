# Speed limits for indoor trials: real robot and sim `kinematic` locomotion (INTERFACES.md section 2).
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.6
      vx_min: -0.1
      vy_max: 0.3
      wz_max: 0.8
velocity_smoother:
  ros__parameters:
    max_velocity: [0.6, 0.3, 0.8]
    min_velocity: [-0.1, -0.3, -0.8]
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.6
