# Mode explore: the explore skill in a loop until /nav/next_frontier reports nothing left.
odom_source: lidar
timeout_s: 900.0
no_progress_window_s: 90.0
progress_min_distance_m: 0.15
safety_abort_s: 45.0
teleop_cancels_task: true
strategy: informative       # nearest | largest | informative | bias
steps: 1
scan: true
real:
  timeout_s: 1200.0
  no_progress_window_s: 120.0
