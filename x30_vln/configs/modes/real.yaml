# x30_modes parameters, profile "real" (X30 through nav_bridge). Slower, larger margins. Limits follow docs/robot/x30-interfaces.md
# section 5.1: initial indoor autonomy vx 0.4 / back 0.15 / vy 0.2 / wz 0.5, accel <= 0.5 m/s2, command timeout <= 0.5 s.
# Raise only after the stopping distance has been measured on the robot (scripts in the x30_hw package). Dimensions are estimates.
cmd_vel_mux:
  ros__parameters:
    rate_hz: 20.0
    teleop_timeout_s: 0.4
    nav_timeout_s: 0.4
    teleop_lockout_s: 1.0
    gate_by_mode: true
    initial_mode: idle

safety_guard:
  ros__parameters:
    rate_hz: 20.0
    obstacle_source: costmap_cloud
    front: 0.6
    rear: 0.6
    half_width: 0.35
    self_margin: 0.08                # points this close to the footprint are the robot's own body/legs (sim lidar leaks body hits up to ~0.6 m)
    lateral_margin: 0.08
    stop_margin: 0.35
    hard_stop_margin: 0.12
    latency_s: 0.40
    decel: 0.8
    ang_decel: 1.5
    accel_x: 0.5
    accel_y: 0.4
    accel_w: 1.0
    vx_max: 0.4
    vx_min: -0.15
    vy_max: 0.2
    wz_max: 0.5
    cmd_timeout_s: 0.4
    obstacle_timeout_s: 0.8
    require_obstacles: true
    max_tilt_deg: 30.0
    z_min: -0.25
    z_max: 0.70

mode_manager:
  ros__parameters:
    profile: real
    odom_topic: /odom
    cancel_wait_s: 8.0

skill_server:
  ros__parameters:
    obstacle_source: costmap_cloud
    front: 0.6
    rear: 0.6
    half_width: 0.35
    self_margin: 0.08
    lin_speed: 0.20
    back_speed: 0.10
    strafe_speed: 0.10
    turn_speed: 0.30
    lin_accel: 0.30
    lin_decel: 0.40
    turn_accel: 0.50
    turn_decel: 0.60
    coast_s: 0.40
    min_standoff_m: 0.70
    approach_speed: 0.12
    goal_tolerance_m: 0.6
    nav_blocked_abort_s: 8.0
    nav_stuck_s: 40.0
    explore_goal_timeout_s: 180.0
    explore_scan_step_deg: 60.0
    explore_scan_dwell_s: 1.5
